<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리반 1인 1역 다했니?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        jua: ['Jua', 'sans-serif'],
                    },
                    colors: {
                        cookie: {
                            bg: '#FFF8E7',
                            border: '#FFD369',
                            btn: '#FF9F43',
                            btnHover: '#FF8C00',
                            text: '#574b90',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #FFF8E7;
            color: #574b90;
            user-select: none; /* 방해되는 텍스트 선택 방지 (태블릿 최적화) */
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .card-shadow {
            box-shadow: 0 8px 0px 0px #FFD369, 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
        }
        
        .btn-press {
            box-shadow: 0 5px 0px 0px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .btn-press:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px 0px rgba(0,0,0,0.2);
        }

        .day-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-btn.active {
            transform: scale(1.1);
        }

        .toast {
            animation: slideUp 0.3s ease-out forwards, fadeOut 0.3s ease-in 2.5s forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Header -->
    <header class="w-full max-w-5xl flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold text-cookie-btn drop-shadow-md">
                <i class="fa-solid fa-cookie-bite mr-2"></i>우리반 1인 1역
            </h1>
            <p class="text-lg md:text-xl text-cookie-text mt-1 opacity-80" id="sync-status">
                <i class="fa-solid fa-cloud-arrow-down mr-1"></i> 서버 연결 중...
            </p>
        </div>
        <div class="flex gap-3">
            <button onclick="refreshCookies()" class="btn-press bg-orange-400 text-white px-4 h-14 rounded-2xl text-xl font-bold flex justify-center items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 쿠키 갱신
            </button>
            <button onclick="openModal('addStudentModal')" class="btn-press bg-green-400 text-white w-14 h-14 rounded-full text-2xl flex justify-center items-center">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="openModal('settingsModal')" class="btn-press bg-gray-400 text-white w-14 h-14 rounded-full text-2xl flex justify-center items-center">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Grid -->
    <main id="student-grid" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
        <!-- Student cards will be injected here -->
        <div class="text-center col-span-full py-10 text-gray-400 text-xl">
            데이터를 불러오는 중입니다...
        </div>
    </main>

    <!-- Add/Edit Student Modal -->
    <div id="addStudentModal" class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center hidden z-50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md border-4 border-cookie-border shadow-xl transform transition-transform scale-95" id="studentModalContent">
            <div class="flex justify-between items-center mb-4">
                <h2 id="studentModalTitle" class="text-2xl font-bold">학생 개별 추가</h2>
                <button onclick="closeModal('addStudentModal')" class="text-gray-400 hover:text-red-500 text-3xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="hidden" id="editStudentId" value="">
            <div class="space-y-5">
                <div>
                    <label class="block text-lg mb-1 font-bold">이름</label>
                    <input type="text" id="studentNameInput" class="w-full border-2 border-gray-200 rounded-xl p-4 text-xl focus:border-cookie-btn outline-none" placeholder="예: 김철수">
                </div>
                <div>
                    <label class="block text-lg mb-1 font-bold">담당 역할 (1인 1역)</label>
                    <input type="text" id="studentRoleInput" class="w-full border-2 border-gray-200 rounded-xl p-4 text-xl focus:border-cookie-btn outline-none" placeholder="예: 칠판 지우기">
                </div>
            </div>
            <div class="mt-8 flex gap-4">
                <button onclick="deleteStudent()" id="deleteStudentBtn" class="hidden btn-press bg-red-400 text-white flex-1 py-4 rounded-xl text-xl font-bold">삭제</button>
                <button onclick="saveStudent()" class="btn-press bg-cookie-btn text-white flex-1 py-4 rounded-xl text-xl font-bold">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal (Bulk Import & Reset) -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center hidden z-50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-lg border-4 border-cookie-border shadow-xl h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold"><i class="fa-solid fa-gear mr-2 text-gray-500"></i>학급 관리</h2>
                <button onclick="closeModal('settingsModal')" class="text-gray-400 hover:text-red-500 text-3xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-6 pr-2">
                <!-- 연동 설정 -->
                <div class="bg-gray-50 p-4 rounded-2xl border-2 border-gray-200">
                    <h3 class="text-xl font-bold text-gray-700 mb-2"><i class="fa-solid fa-link mr-1"></i> 클라우드 및 API 설정</h3>
                    <p class="text-sm text-gray-600 mb-3">설정값을 입력하면 다른 기기와 실시간 동기화됩니다.</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-1">Firebase 설정 (JSON)</label>
                            <textarea id="firebaseConfigInput" class="w-full h-24 border-2 border-gray-300 rounded-xl p-2 text-sm focus:border-gray-400 outline-none resize-none font-mono" placeholder='{&#10;  "apiKey": "...",&#10;  "authDomain": "...",&#10;  "projectId": "..."&#10;}'></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-1">Firebase 컬렉션 이름 (중복 방지)</label>
                            <input type="text" id="fbCollectionInput" class="w-full border-2 border-gray-300 rounded-xl p-2 text-sm focus:border-gray-400 outline-none" placeholder="예: class_roles_2026">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-1">다했니 API 키 (선택)</label>
                            <input type="text" id="apiKeyInput" class="w-full border-2 border-gray-300 rounded-xl p-2 text-sm focus:border-gray-400 outline-none" placeholder="API 키를 입력하세요">
                        </div>
                        <button onclick="saveSyncSettings()" class="btn-press w-full bg-gray-700 text-white py-3 rounded-xl text-md font-bold mt-2">설정 저장 및 새로고침</button>
                    </div>
                </div>

                <!-- 이번 주 초기화 -->
                <div class="bg-red-50 p-4 rounded-2xl border-2 border-red-200">
                    <h3 class="text-xl font-bold text-red-600 mb-2"><i class="fa-solid fa-rotate-right mr-1"></i> 이번 주 기록 초기화</h3>
                    <p class="text-sm text-gray-600 mb-3">모든 학생의 월~금 체크 기록과 보상 여부를 초기화합니다. (매주 월요일 사용)</p>
                    <button onclick="resetAllRecords()" class="btn-press w-full bg-red-400 text-white py-3 rounded-xl text-lg font-bold">전체 기록 리셋하기</button>
                </div>

                <!-- 일괄 붙여넣기 -->
                <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-200">
                    <h3 class="text-xl font-bold text-blue-600 mb-2"><i class="fa-solid fa-users mr-1"></i> 명렬표 일괄 붙여넣기</h3>
                    <p class="text-sm text-gray-600 mb-2">엑셀이나 메모장에서 학생 이름 명단을 복사해서 붙여넣으세요. 띄어쓰기나 줄바꿈으로 구분됩니다.</p>
                    <p class="text-xs text-gray-500 mb-3">예시: 김철수 이영희 박민수 ...</p>
                    <textarea id="bulkImportText" class="w-full h-32 border-2 border-blue-200 rounded-xl p-3 text-lg focus:border-blue-400 outline-none resize-none" placeholder="여기에 이름을 붙여넣으세요..."></textarea>
                    <button onclick="bulkImportStudents()" class="btn-press w-full bg-blue-500 text-white py-3 mt-3 rounded-xl text-lg font-bold">명단 일괄 추가하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-10 left-0 right-0 flex flex-col items-center gap-2 z-50 pointer-events-none"></div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let app, db, auth;
        let isFirebaseReady = false;

        // State Management
        window.appState = {
            students: [],
            docRef: null,
            userId: null
        };

        const days = ['mon', 'tue', 'wed', 'thu', 'fri'];
        const dayLabels = ['월', '화', '수', '목', '금'];

        async function initAuth() {
            const customConfigStr = localStorage.getItem('customFirebaseConfig');
            
            if (customConfigStr) {
                try {
                    const customConfig = JSON.parse(customConfigStr);
                    app = initializeApp(customConfig, "TeacherApp");
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    await signInAnonymously(auth);
                    
                    if (!auth.currentUser) return;
                    
                    window.appState.userId = auth.currentUser.uid;
                    
                    const collectionName = localStorage.getItem('customFbCollection') || 'class_roles_2026';
                    // 데이터 동기화를 위한 커스텀 컬렉션 경로 설정
                    window.appState.docRef = doc(db, collectionName, 'class_data');
                    
                    isFirebaseReady = true;
                    document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-cloud text-green-500"></i> 실시간 동기화 켜짐`;
                    
                    startSync();
                } catch (error) {
                    console.error("Custom Firebase init error:", error);
                    document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500"></i> 설정 오류 (오프라인)`;
                    loadLocalData();
                    renderGrid();
                }
            } else {
                document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-yellow-500"></i> 오프라인 모드 (설정 필요)`;
                loadLocalData();
                renderGrid();
            }
        }

        function startSync() {
            if (!window.appState.docRef) return;

            onSnapshot(window.appState.docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.appState.students = docSnap.data().students || [];
                    renderGrid();
                } else {
                    // Document doesn't exist yet, save empty array or mock data
                    syncToServer([]);
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                showToast("데이터 동기화 중 오류가 발생했습니다.", "error");
            });
        }

        window.syncToServer = async function(studentsArray) {
            // Update local state immediately for fast UI
            window.appState.students = studentsArray;
            renderGrid();

            // Then sync to server if available
            if (isFirebaseReady && window.appState.docRef && auth.currentUser) {
                try {
                    await setDoc(window.appState.docRef, { students: studentsArray });
                } catch (error) {
                    console.error("Save error:", error);
                    showToast("서버 저장 실패", "error");
                }
            } else {
                // Fallback to memory/localStorage if offline
                localStorage.setItem('localClassData', JSON.stringify(studentsArray));
            }
        };

        function loadLocalData() {
            const saved = localStorage.getItem('localClassData');
            if (saved) {
                window.appState.students = JSON.parse(saved);
            } else {
                // Sample Data
                window.appState.students = [
                    { id: 1, name: '김지훈', role: '칠판 지우기', history: { mon: true, tue: true, wed: false, thu: false, fri: false }, rewardGiven: false },
                    { id: 2, name: '이수진', role: '우유 당번', history: { mon: true, tue: true, wed: true, thu: true, fri: true }, rewardGiven: false },
                    { id: 3, name: '박민준', role: '분리수거', history: { mon: false, tue: false, wed: false, thu: false, fri: false }, rewardGiven: false }
                ];
            }
        }

        window.renderGrid = function() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';

            if(window.appState.students.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center">
                        <div class="text-6xl mb-4">📭</div>
                        <h3 class="text-2xl font-bold text-gray-500 mb-2">아직 등록된 학생이 없습니다.</h3>
                        <p class="text-gray-400">우측 상단의 톱니바퀴나 + 버튼을 눌러 학생을 추가해보세요!</p>
                    </div>`;
                return;
            }

            window.appState.students.forEach(student => {
                // Mon-Fri buttons HTML
                let daysHtml = '<div class="flex justify-between mt-5 mb-2 w-full px-2">';
                
                days.forEach((dayKey, index) => {
                    const isDone = student.history && student.history[dayKey] === true;
                    const bgClass = isDone ? 'bg-green-400 shadow-[0_4px_0_0_#4ade80]' : 'bg-gray-200 shadow-[0_4px_0_0_#d1d5db]';
                    const textClass = isDone ? 'text-white' : 'text-gray-500';
                    const icon = isDone ? '<i class="fa-solid fa-check"></i>' : dayLabels[index];
                    
                    daysHtml += `
                        <button onclick="toggleDay(${student.id}, '${dayKey}')" 
                                class="day-btn w-12 h-12 rounded-full ${bgClass} ${textClass} text-lg font-bold flex justify-center items-center active:translate-y-1 active:shadow-none">
                            ${icon}
                        </button>
                    `;
                });
                daysHtml += '</div>';

                // Reward toggle button
                const rewardClass = student.rewardGiven 
                    ? 'bg-cookie-btn text-white border-cookie-btn' 
                    : 'bg-white text-gray-400 border-gray-200';
                const rewardIcon = student.rewardGiven ? '<i class="fa-solid fa-gift mr-2"></i> 보상 완료' : '<i class="fa-solid fa-gift mr-2"></i> 보상 대기';

                const card = document.createElement('div');
                card.className = 'card-shadow bg-white rounded-3xl border-4 border-cookie-border p-5 flex flex-col relative';
                
                card.innerHTML = `
                    <button onclick="editStudent(${student.id})" class="absolute top-4 right-4 w-10 h-10 flex justify-center items-center text-gray-300 hover:text-cookie-btn text-xl transition-colors">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    
                    <div class="flex items-center gap-4 mb-2">
                        <div class="w-14 h-14 bg-blue-100 rounded-full flex justify-center items-center text-3xl shrink-0">
                            👦
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <h3 class="text-3xl font-bold text-gray-800 truncate">${student.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <p class="text-base text-cookie-btn font-bold truncate"><i class="fa-solid fa-tag mr-1"></i>${student.role || '역할 미정'}</p>
                                <span class="text-sm bg-orange-100 text-orange-600 px-2 py-1 rounded-full font-bold whitespace-nowrap">
                                    🍪 ${student.cookieCount !== undefined ? student.cookieCount + '개' : '?개'}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    ${daysHtml}

                    <div class="mt-auto pt-6">
                        <button onclick="toggleReward(${student.id})" class="btn-press w-full py-3 rounded-2xl text-xl font-bold border-4 transition-colors flex justify-center items-center ${rewardClass}">
                            ${rewardIcon}
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        window.toggleDay = function(studentId, dayKey) {
            const newStudents = [...window.appState.students];
            const studentIndex = newStudents.findIndex(s => s.id === studentId);
            
            if (studentIndex > -1) {
                const currentStatus = newStudents[studentIndex].history[dayKey];
                newStudents[studentIndex].history[dayKey] = !currentStatus;
                
                if (!currentStatus) {
                    showToast(`${newStudents[studentIndex].name} - 역할 완료! 👏`, 'success');
                }
                
                syncToServer(newStudents);
            }
        }

        window.toggleReward = function(studentId) {
            const newStudents = [...window.appState.students];
            const studentIndex = newStudents.findIndex(s => s.id === studentId);
            
            if (studentIndex > -1) {
                newStudents[studentIndex].rewardGiven = !newStudents[studentIndex].rewardGiven;
                syncToServer(newStudents);
                
                if(newStudents[studentIndex].rewardGiven) {
                    showToast(`🎁 ${newStudents[studentIndex].name} 보상 체크 완료!`, 'success');
                }
            }
        }

        window.openModal = function(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
            
            if(id === 'addStudentModal') {
                document.getElementById('studentNameInput').focus();
            } else if (id === 'settingsModal') {
                document.getElementById('firebaseConfigInput').value = localStorage.getItem('customFirebaseConfig') || '';
                document.getElementById('fbCollectionInput').value = localStorage.getItem('customFbCollection') || 'class_roles_2026';
                document.getElementById('apiKeyInput').value = localStorage.getItem('customApiKey') || '';
            }
        }

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if(id === 'addStudentModal') {
                    document.getElementById('studentNameInput').value = '';
                    document.getElementById('studentRoleInput').value = '';
                    document.getElementById('editStudentId').value = '';
                    document.getElementById('deleteStudentBtn').classList.add('hidden');
                    document.getElementById('studentModalTitle').innerText = '학생 추가';
                }
                if(id === 'settingsModal') {
                    document.getElementById('bulkImportText').value = '';
                }
            }, 200);
        }

        window.saveStudent = function() {
            const name = document.getElementById('studentNameInput').value.trim();
            const role = document.getElementById('studentRoleInput').value.trim();
            const editId = document.getElementById('editStudentId').value;

            if (!name) {
                showToast('이름을 입력해주세요.', 'error');
                return;
            }

            let newStudents = [...window.appState.students];

            if (editId) {
                const index = newStudents.findIndex(s => s.id === parseInt(editId));
                if (index > -1) {
                    newStudents[index].name = name;
                    newStudents[index].role = role;
                    showToast('학생 정보가 수정되었습니다.', 'success');
                }
            } else {
                const newId = newStudents.length > 0 ? Math.max(...newStudents.map(s => s.id)) + 1 : 1;
                newStudents.push({
                    id: newId,
                    name: name,
                    role: role,
                    history: { mon: false, tue: false, wed: false, thu: false, fri: false },
                    rewardGiven: false
                });
                showToast('새로운 학생이 추가되었습니다.', 'success');
            }

            syncToServer(newStudents);
            closeModal('addStudentModal');
        }

        window.editStudent = function(id) {
            const student = window.appState.students.find(s => s.id === id);
            if (!student) return;

            document.getElementById('editStudentId').value = student.id;
            document.getElementById('studentNameInput').value = student.name;
            document.getElementById('studentRoleInput').value = student.role || '';
            
            document.getElementById('studentModalTitle').innerText = '학생 정보 수정';
            document.getElementById('deleteStudentBtn').classList.remove('hidden');
            
            openModal('addStudentModal');
        }

        window.deleteStudent = function() {
            const editId = document.getElementById('editStudentId').value;
            if (!editId) return;
            
            const newStudents = window.appState.students.filter(s => s.id !== parseInt(editId));
            syncToServer(newStudents);
            
            showToast('학생이 삭제되었습니다.', 'success');
            closeModal('addStudentModal');
        }

        window.bulkImportStudents = function() {
            const text = document.getElementById('bulkImportText').value.trim();
            if (!text) {
                showToast('명단을 입력해주세요.', 'error');
                return;
            }

            // 공백, 줄바꿈, 쉼표 등으로 분리하고 빈 문자열 제거
            const names = text.split(/[\s,\n]+/).filter(n => n.trim() !== '');
            
            if(names.length === 0) return;

            let newStudents = [...window.appState.students];
            let startId = newStudents.length > 0 ? Math.max(...newStudents.map(s => s.id)) + 1 : 1;

            names.forEach(name => {
                newStudents.push({
                    id: startId++,
                    name: name,
                    role: '',
                    history: { mon: false, tue: false, wed: false, thu: false, fri: false },
                    rewardGiven: false
                });
            });

            syncToServer(newStudents);
            showToast(`${names.length}명의 학생이 추가되었습니다!`, 'success');
            closeModal('settingsModal');
        }

        window.resetAllRecords = function() {
            if(window.appState.students.length === 0) return;

            const newStudents = window.appState.students.map(student => ({
                ...student,
                history: { mon: false, tue: false, wed: false, thu: false, fri: false },
                rewardGiven: false
            }));

            syncToServer(newStudents);
            showToast('모든 기록이 초기화되었습니다.', 'success');
            closeModal('settingsModal');
        }

        window.saveSyncSettings = function() {
            const configStr = document.getElementById('firebaseConfigInput').value.trim();
            const collectionName = document.getElementById('fbCollectionInput').value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            
            if (configStr) {
                try {
                    JSON.parse(configStr); // JSON 문법 검사
                } catch (e) {
                    showToast('Firebase 설정은 유효한 JSON 형식이어야 합니다.', 'error');
                    return;
                }
                localStorage.setItem('customFirebaseConfig', configStr);
            } else {
                localStorage.removeItem('customFirebaseConfig');
            }
            
            if (collectionName) {
                localStorage.setItem('customFbCollection', collectionName);
            } else {
                localStorage.removeItem('customFbCollection');
            }
            
            if (apiKey) {
                localStorage.setItem('customApiKey', apiKey);
            } else {
                localStorage.removeItem('customApiKey');
            }
            
            showToast('설정이 저장되었습니다. 새로고침됩니다.', 'success');
            setTimeout(() => {
                location.reload();
            }, 1000);
        }

        window.refreshCookies = function() {
            const apiKey = localStorage.getItem('customApiKey');
            if (!apiKey) {
                showToast("설정(⚙️)에서 다했니 API 키를 먼저 입력해주세요!", "error");
                return;
            }
            
            showToast("쿠키 정보를 불러오는 중...", "info");
            
            const btn = document.querySelector('button[onclick="refreshCookies()"]');
            if(btn) {
                btn.disabled = true;
                btn.classList.add('opacity-50');
            }

            // 다했니 API 시뮬레이션 (1초 후 모든 학생 쿠키 랜덤 갱신)
            setTimeout(() => {
                const newStudents = [...window.appState.students];
                newStudents.forEach(student => {
                    student.cookieCount = Math.floor(Math.random() * 50) + 1;
                });
                syncToServer(newStudents);
                showToast("모든 학생의 쿠키 업데이트 완료!", "success");
                if(btn) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }
            }, 1000);
        }

        // Utility
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-gray-800';
            let icon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';
            if (type === 'success') {
                bg = 'bg-cookie-btn';
                icon = '<i class="fa-solid fa-check-circle text-white"></i>';
            } else if (type === 'error') {
                bg = 'bg-red-500';
                icon = '<i class="fa-solid fa-triangle-exclamation text-white"></i>';
            }

            toast.className = `toast ${bg} text-white px-6 py-4 rounded-full shadow-lg font-bold flex items-center gap-3 text-xl pointer-events-auto`;
            toast.innerHTML = `${icon} ${message}`;
            
            container.appendChild(toast);

            setTimeout(() => {
                if(toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 3000);
        }

        // Initialize App
        initAuth();

    </script>
</body>
</html>
